 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="logo">
      <svg viewBox="0 0 48 48">
        <path d="M19 15H15a9 9 0 0 0 0 18h6.5" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M29 33h4a9 9 0 0 0 0-18h-6.5" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Subscription Hub</h1>
    <p>Manage all your subscriptions in one place.</p>
    <a class="signin-link" href="login.html">Owner / Staff sign in</a>
  </header>

  <main>
    <h2>Discover Subscriptions</h2>
    <p>Choose your favourite subscription service.</p>
    <section class="services">
      <div class="service-card">
        <h3>Netflix</h3>
        <p>Movies and TV shows</p>
      </div>
      <div class="service-card">
        <h3>Amazon Prime</h3>
        <p>Entertainment and more</p>
      </div>
      <div class="service-card">
        <h3>JioHotstar</h3>
        <p>Sports, movies and shows</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Subscription Hub</p>
  </footer>
</body>
</html>
